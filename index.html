<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://docs.google.com https://*.googleusercontent.com; img-src 'self' data:; manifest-src 'self'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Link Launcher</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #aaa;
      --tile-bg: #111;
      --tile-bg-hover: #1a1a1a;
      --tile-border: #2a2a2a;
      --gap: clamp(10px, 2.2vw, 18px);
      --radius: 18px;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --fab-bg: rgba(20,20,20,.9);
      --fab-border: rgba(255,255,255,.12);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    header {
      padding: 14px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 600;
      letter-spacing: .2px;
      opacity: .95;
    }

    header .meta {
      font-size: 12px;
      opacity: .7;
      white-space: nowrap;
    }

    body.kiosk header { display: none; }

    main {
      flex: 1;
      display: grid;
      padding: var(--gap);
      gap: var(--gap);
      align-content: stretch;
      justify-content: stretch;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: var(--tile-bg);
      border: 1px solid var(--tile-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      font-weight: 700;
      color: var(--fg);
      min-height: 90px;
      font-size: clamp(14px, 2.8vw, 26px);
      line-height: 1.1;
      transition: transform .08s ease, background .08s ease;
    }

    .tile:active {
      transform: scale(.985);
      background: var(--tile-bg-hover);
    }

    .tile:focus-visible {
      outline: 3px solid rgba(255,255,255,.25);
      outline-offset: 3px;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    #overlay.show { display: flex; }

    .card {
      width: min(680px, 100%);
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .card p {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.45;
      opacity: .92;
      word-break: break-word;
      white-space: pre-wrap;
    }

    #overlayHint {
      color: var(--muted);
      font-size: 13px;
    }

    #overlayText:empty,
    #overlayHint:empty { display: none; }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button,
    .button-link {
      appearance: none;
      border: 1px solid #2a2a2a;
      background: #161616;
      color: white;
      padding: 10px 13px;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }

    button:active,
    .button-link:active { transform: scale(.99); }

    button:hover,
    .button-link:hover { background: #1c1c1c; }

    #fullscreenBtn {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: var(--fab-bg);
      border: 1px solid var(--fab-border);
      color: var(--fg);
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
      backdrop-filter: blur(6px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #fullscreenBtn:active { transform: scale(.985); }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1 id="pageTitle">Link Launcher</h1>
      <div class="meta" id="meta"></div>
    </header>
    <main id="grid" aria-label="Link grid"></main>
  </div>

  <button id="fullscreenBtn" type="button" aria-label="Enter fullscreen">
    ⛶ Fullscreen
  </button>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
    <div class="card">
      <h2 id="overlayTitle">Link Launcher</h2>
      <p id="overlayText"></p>
      <p id="overlayHint"></p>
      <div class="row" id="overlayActions"></div>
    </div>
  </div>

  <noscript>
    <p>This app needs JavaScript to load a configured CSV.</p>
  </noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
